<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <h1>متجري الإلكتروني</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="cart.html">سلة المشتريات 🛒</a>
      <a href="login.html">تسجيل الدخول</a>
      <select onchange="changeLanguage(this.value)" id="lang-select">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </nav>
  </header>

  <main class="products">
    <div class="card">
      <img src="assets/images/product1.jpg" alt="منتج 1">
      <h3>منتج 1</h3>
      <p class="price">30 دينار</p>
      <button class="btn" onclick="addToCart('منتج 1', 30)">أضف إلى السلة</button>
    </div>
    <div class="card">
      <img src="assets/images/product2.jpg" alt="منتج 2">
      <h3>منتج 2</h3>
      <p class="price">50 دينار</p>
      <button class="btn" onclick="addToCart('منتج 2', 50)">أضف إلى السلة</button>
    </div>
    <div class="card">
      <img src="assets/images/product3.jpg" alt="منتج 3">
      <h3>منتج 3</h3>
      <p class="price">40 دينار</p>
      <button class="btn" onclick="addToCart('منتج 3', 40)">أضف إلى السلة</button>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    function changeLanguage(lang) {
      // Placeholder for language-switch logic
      alert('تغيير اللغة إلى: ' + lang);
    }
  </script>
</body>
</html>
